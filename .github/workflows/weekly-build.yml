name: Weekly open-source candidate
on:
  schedule:
    - cron: '17 9 * * 6'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and test; candidate cannot be released
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: model-fieldnotes-paid-automation
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main' && (vars.AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate source without executing it
        id: generate
        run: node automation/build.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-${{ github.run_id }}
          path: .automation-output/
          include-hidden-files: true
          retention-days: 30
  test:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}
          path: .automation-output
      - name: Verify candidate identity
        run: node automation/candidate.ts --check
      - name: Run untrusted tests in a read-only container with no network or secrets
        run: |
          docker pull node:24-alpine
          timeout 120 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 256m --cpus 1 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=32m -v "$PWD/.automation-output/project:/work:ro" -w /work node:24-alpine node --test > .automation-output/test-results.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ github.run_id }}
          path: .automation-output/
          include-hidden-files: true
          retention-days: 30
      - name: Review instructions
        run: |
          echo '## Candidate tested; not released' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the complete source, README, alternatives and test output in the candidate artifact. To release, dispatch Approved project release with this run ID and exact digest, then approve the protected environment.' >> "$GITHUB_STEP_SUMMARY"
          node automation/candidate.ts --check >> "$GITHUB_STEP_SUMMARY"
  notify:
    needs: [generate, test]
    if: always() && needs.generate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Report candidate or failure
        run: node --input-type=module -e 'import {report,repo} from "./automation/github.ts"; await report("Weekly build needs review", `Result ${process.env.RESULT}. Review source and tests at https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}. No repository was released.`)'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
